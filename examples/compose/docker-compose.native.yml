# Demo-only Compose example using the native DuckDuckGo HTML backend.
# Not intended for production use.

services:
  search-gateway:
    image: ghcr.io/coolapso/searchbase/search-gateway:latest
    ports:
      - "8080:8080"
    environment:
      SEARCHBASE_PORT: "8080"
      SEARCHBASE_CRAWL_WORKER_ADDRESS: http://crawl-worker:8000
      SEARCHBASE_SEARCH_PROVIDER: searchbase_ddg
    depends_on:
      - crawl-worker

  crawl-worker:
    image: ghcr.io/coolapso/searchbase/crawl-worker:latest
    ports:
      - "8000:8000"
